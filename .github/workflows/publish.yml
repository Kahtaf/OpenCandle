name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already merged to main (without v)
        type: string
        required: true
      publish:
        description: Create the tag and publish after validation
        type: boolean
        default: false
      advisory_comparison:
        description: Also run the judged competitive comparison
        type: boolean
        default: false

concurrency:
  group: opencandle-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Configure main-only deployments and required reviewers in repository settings.
    # Declaring the environment cannot create or verify its protection.
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      OPENCANDLE_ROUTER_PROVIDER: google
      OPENCANDLE_ROUTER_MODEL: gemini-2.5-flash
      OPENCANDLE_EVAL_MODEL_PROVIDER: google
      OPENCANDLE_EVAL_MODEL: gemini-2.5-flash
      OPENCANDLE_COMPETITIVE_PROVIDER: google
      OPENCANDLE_COMPETITIVE_MODEL: gemini-2.5-flash
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify candidate version and main ancestry
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          WILL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          package_version="$(node -p "require('./package.json').version")"
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$package_version" = "$EXPECTED_VERSION"
          if [[ "$WILL_PUBLISH" == true ]]; then
            grep -Fq "## [$package_version]" CHANGELOG.md
            tag="v$package_version"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA"
            fi
          fi

      - name: Verify required model access
        run: node scripts/release-preflight.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run provider release smoke
        run: npm run test:providers:release
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}

      - name: Install Chromium for GUI smoke tests
        run: npx playwright-core install --with-deps chromium

      - name: Run release checks and prepare the exact package without secrets
        run: npm run release:check

      - name: Run fresh live release evals
        run: npm run eval -- release
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}

      - name: Write compact release summary
        run: node scripts/release-summary.mjs --package-dir validation-output/release-package

      # Bounded schema reports plus the exact tested tarball only; raw
      # `.completion.json` files and Vitest reporter traces/logs are never
      # uploaded. `if: always()` preserves failure evidence, and `warn` avoids
      # masking the original failure when an earlier stage produced no proof.
      # Uploaded reports are evidence only, never authority: the publish step
      # re-verifies the exact tarball hash, candidate, and version in-workflow.
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.run_attempt }}
          path: |
            validation-output/release-evals/**/release-eval-startup.json
            validation-output/release-evals/**/release-evidence.json
            validation-output/release-evals/**/release-eval-summary.json
            validation-output/release-evals/**/release-eval-incomplete.json
            validation-output/release-evals/**/attempts.jsonl
            validation-output/release-package/package-proof.json
            validation-output/release-package/*.tgz
            validation-output/provider-release/**/summary.json
            validation-output/gates/*.json
            validation-output/release-summary/**/summary.json
            validation-output/release-summary/**/summary.md
            coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish exact verified tarball to npm
        if: inputs.publish
        run: |
          set -euo pipefail
          proof_dir="validation-output/release-package"
          node scripts/release-package.mjs verify --dir "$proof_dir"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tarball="$proof_dir/$(node -p "require('./$proof_dir/package-proof.json').tarball")"
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="v$version"

          tag_refs="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [[ -n "$tag_refs" ]]; then
            tagged_commit="$(awk -v ref="refs/tags/$tag" '$2 == ref { tag = $1 } $2 == ref "^{}" { peeled = $1 } END { print peeled ? peeled : tag }' <<< "$tag_refs")"
            test "$tagged_commit" = "$GITHUB_SHA"
          fi

          # A rerun after npm accepted the version can finish the GitHub release.
          # Only a byte-identical public package satisfies this recovery path.
          if npm view "$name@$version" dist.integrity --prefer-online > "$RUNNER_TEMP/release-integrity"; then
            expected="$(node -e 'const f=require("node:fs"), c=require("node:crypto"); process.stdout.write("sha512-"+c.createHash("sha512").update(f.readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
            test "$(cat "$RUNNER_TEMP/release-integrity")" = "$expected"
          else
            npm publish "$tarball" --ignore-scripts --access public --provenance
          fi

          if [[ -z "$tag_refs" ]]; then
            git push origin "HEAD:refs/tags/$tag"
          fi

      - name: Create GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          if state=$(gh release view "$tag" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease'); then
            test "$state" = false
          else
            gh release create "$tag" --verify-tag --generate-notes
          fi

  advisory:
    if: github.ref == 'refs/heads/main' && inputs.advisory_comparison
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run advisory comparison
        run: npm run eval -- competitive:frozen --provider google --model gemini-2.5-flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCANDLE_COMPETITIVE_NO_CACHE: "1"
          OPENCANDLE_COMPETITIVE_ASSERTIONS_ONLY: "0"
