name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22.2", "24.x", "26.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        if: matrix.node-version == '24.x'
        run: npx tsc --noEmit

      - name: Typecheck provider relay
        if: matrix.node-version == '24.x'
        run: npm run relay:typecheck

      - name: Lint
        if: matrix.node-version == '24.x'
        run: npx biome ci .

      # The full Node 24.x leg builds the site because the public-site build
      # contract tests in `npm test` read website/dist output.
      - name: Build public docs
        if: matrix.node-version == '24.x'
        run: npm run docs:site:build

      - name: Validate package contents
        if: matrix.node-version == '24.x'
        run: npm run package:contents:check

      - name: Run tests
        if: matrix.node-version == '24.x'
        run: npm test

      - name: Run provider relay tests
        if: matrix.node-version == '24.x'
        run: npm run relay:test

      - name: Run agent tool tests
        if: matrix.node-version == '24.x'
        run: npm run test:agent-tools

      - name: Install Chromium for GUI release smoke
        if: matrix.node-version == '24.x'
        run: npx playwright-core install --with-deps chromium

      - name: Run GUI release smoke
        if: matrix.node-version == '24.x'
        run: npm run test:gui:release-smoke

      - name: Run hosted PWA browser smoke
        if: matrix.node-version == '24.x'
        run: npm run test:gui:hosted

      - name: Packed install smoke
        run: npm run test:packed-install

      - name: Verify packaged CLI boots
        run: |
          expected_version="$(node -p "require('./package.json').version")"
          test "$(node dist/cli.js --version)" = "$expected_version"
          node dist/cli.js --help > /dev/null

      - name: Check public docs external links
        if: matrix.node-version == '24.x'
        run: npm run docs:links:check
