name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "24.x", "26.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx biome ci .

      - name: Build public docs
        if: matrix.node-version == '24.x'
        run: npm run docs:site:build

      - name: Validate package contents
        if: matrix.node-version == '24.x'
        run: npm run package:contents:check

      - name: Run tests
        run: npm test

      - name: Packed install smoke
        if: matrix.node-version == '24.x'
        run: npm run test:packed-install

      - name: Check public docs external links
        if: matrix.node-version == '24.x'
        run: npm run docs:links:check
