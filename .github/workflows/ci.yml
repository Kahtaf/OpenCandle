name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22.2", "24.x", "26.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Node 24 is the canonical proof runtime: one `gates:full` run covers
      # check, unit/relay/agent-tool tests, site, browser integration, GUI
      # release smoke, hosted PWA smoke, package contents, and coverage.
      - name: Install Chromium for GUI browser gates
        if: matrix.node-version == '24.x'
        run: npx playwright-core install --with-deps chromium

      - name: Run full gate
        if: matrix.node-version == '24.x'
        run: npm run gates:full

      # Kept as an explicit canonical-runtime step: the shared `full` policy
      # does not include the external public-doc link check, and this preserves
      # the check CI ran before the shared gate runner existed.
      - name: Check public docs external links
        if: matrix.node-version == '24.x'
        run: npm run docs:links:check

      # Coverage is uploaded even when the gate above fails so the failure is
      # diagnosable; a missing summary on the proof runtime is itself an error.
      - name: Upload coverage
        if: always() && matrix.node-version == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/
            coverage/coverage-summary.json
            validation-output/gates/*.json
          if-no-files-found: error
          retention-days: 7

      # Every supported runtime keeps the packed-install and CLI-boot proof, so
      # a packaging regression is caught across the whole matrix.
      - name: Packed install smoke
        run: npm run test:packed-install

      - name: Verify packaged CLI boots
        run: |
          expected_version="$(node -p "require('./package.json').version")"
          test "$(node dist/cli.js --version)" = "$expected_version"
          node dist/cli.js --help > /dev/null
