name: Nightly drift canary

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run live provider checks
        run: npm run test:e2e:providers

      - name: Report missing Gemini API key
        if: env.GEMINI_API_KEY == ''
        run: |
          {
            echo "## :warning: GEMINI_API_KEY is not configured"
            echo
            echo "The advisory live-agent and live-router evals were skipped. Add the repository secret to enable the full nightly drift canary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run advisory live agent eval cases
        if: env.GEMINI_API_KEY != ''
        continue-on-error: true
        shell: bash
        run: |
          status=0
          npm run eval -- cases 2>&1 | tee /tmp/live-agent-eval.log || status=$?
          {
            echo "## Advisory live-agent eval"
            echo
            if [ "$status" -eq 0 ]; then
              echo "All live-agent eval cases passed."
            else
              echo "Live-model drift was detected; the blocking provider and deterministic test gates still passed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Run advisory live router eval
        if: env.GEMINI_API_KEY != ''
        continue-on-error: true
        shell: bash
        run: |
          # Explicit `shell: bash` runs with -e -o pipefail; capture the eval's
          # exit code without aborting so the summary below is still written.
          status=0
          OPENCANDLE_ROUTER_PROVIDER=google OPENCANDLE_ROUTER_MODEL=gemini-2.5-flash npm run eval -- router-live 2>&1 | tee /tmp/router-live.log || status=$?
          pass_rate="$(grep '^pass: ' /tmp/router-live.log | tail -n 1 || true)"
          {
            echo "## Advisory live-router eval"
            echo
            echo "${pass_rate:-Pass rate unavailable (the eval did not reach its summary).}"
            if [ "$status" -ne 0 ]; then
              echo
              echo "This is advisory because known Gemini drift fixtures may fail."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  flake-lane:
    # Advisory repeated-run lane (#209). It repeats selected gate steps with no
    # retry so intermittent failures show up as a nightly pass count instead of
    # one-off reruns on unrelated PRs. It is not a gate, it never feeds release
    # evidence, and it carries no provider or model credentials.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for GUI browser steps
        run: npx playwright-core install --with-deps chromium

      - name: Start flake summary
        run: |
          {
            echo "## Advisory flake lane"
            echo
            echo "Sequential repeats, no retry. Not a gate and not release evidence."
            echo
            echo "| Step | Result | Detail |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hosted PWA smoke x10
        if: always()
        continue-on-error: true
        run: node scripts/flake-lane.mjs --suite test:gui:hosted --runs 10

      - name: GUI integration x5
        if: always()
        continue-on-error: true
        run: node scripts/flake-lane.mjs --suite test:gui:integration --runs 5

      - name: GUI journey x5
        if: always()
        continue-on-error: true
        run: node scripts/flake-lane.mjs --suite test:gui:journey --runs 5

      - name: Unit tests shuffled x3
        if: always()
        continue-on-error: true
        run: node scripts/flake-lane.mjs --suite test --runs 3 -- --sequence.shuffle

      - name: Upload flake lane reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-lane
          path: validation-output/flake/
          if-no-files-found: ignore
          retention-days: 14
